RegistrationPriority: 100

RequiredCppHeaders: 
  - "engine/audio/audio.hpp"
  - "engine/scripting/bindings/stl_vector_binder.hpp"
  - "engine/audio/audio_resource_manager.hpp"

ASNamespace: CE::Audio

ASEnums:
  - Name: AudioType
    CppType: CE::Core::Audio::AudioType

    Values:
      - SFX
      - Music
      - Error

  - Name: AudioEffectType
    CppType: CE::Core::Audio::AudioEffect::Type

    Values:
      - LowPass
      - HighPass
      - Reverb
      - Delay
      - Chorus

ASTypes: 
  - Name: AudioEffect
    CppType: CE::Core::Audio::AudioEffect

    Flags: 
      - Value

    Behaviours:
      - Type: Constructor
        Signature: "" # nothing required
        Body: |
          new(self) CE::Core::Audio::AudioEffect();
        CallingConvention: CDeclObjLast

      - Type: Destruct
        Signature: ""
        Body: |
          delete(self);
        CallingConvention: CDeclObjLast

    Properties:
      - Type: AudioEffectType
        CppMember: Kind
        ASMember: Type

      - Type: bool
        CppMember: Enabled
        ASMember: Enabled

      - Type: float
        CppMember: CutoffHz
        ASMember: CutoffHz

      - Type: float
        CppMember: WetMix
        ASMember: WetMix

      - Type: float 
        CppMember: Feedback
        ASMember: Feedback

      - Type: float 
        CppMember: DelayMs
        ASMember: DelayMs

      - Type: float 
        CppMember: DepthMs
        ASMember: DepthMs

      - Type: float
        CppMember: RateHz
        ASMember: RateHz

      - Type: float 
        CppMember: RoomSize
        ASMember: RoomSize

      - Type: float
        CppMember: Damping
        ASMember: Damping

  - Name: AudioAsset
    CppType: CE::Audio::Resources::AudioHandle

    Flags:
      - Value
      - POD
      - AutoGetFlags

    Properties:
      - Type: uint32
        CppMember: id
        ASMember: handle

    Operators:
      - Operator: "=="
        ReturnType: bool
        Signature: "const AudioAsset& in"
        Body: |
          return self.id == arg0.id;

      - Operator: "=="
        ReturnType: bool
        Signature: "uint"
        Body: |
          return self.id == static_cast<uint32_t>(arg0);
      
      - Operator: "="
        ReturnType: AudioAsset
        Signature: "AudioAsset & in"
        Body: |
          auto& mutable_handle = const_cast<CE::Audio::Resources::AudioHandle&>(self);
          return mutable_handle = arg0;
        CallingConvention: Generic

  - Name: PlayingAudio
    CppType: CE::Audio::Resources::PlayingAudioHandle

    Flags:
      - Value
      - POD
      - AutoGetFlags

    Properties:
      - Type: uint32
        CppMember: id
        ASMember: handle

    Operators:
      - Operator: "=="
        ReturnType: bool
        Signature: "const PlayingAudio& in"
        Body: |
          return self.id == arg0.id;

      - Operator: "=="
        ReturnType: bool
        Signature: "uint"
        Body: |
          return self.id == static_cast<uint32_t>(arg0);

      - Operator: "="
        ReturnType: PlayingAudio
        Signature: "const PlayingAudio & in"
        Body: |
          auto& mutable_handle = const_cast<CE::Audio::Resources::PlayingAudioHandle&>(self);
          return mutable_handle = arg0;
        CallingConvention: Generic
  
  - Name: AudioDeviceInfo
    CppType: CE::Core::Audio::AudioDeviceInfo

    AfterRegister: |
      mScriptEngine.SetDefaultNamespace("CE::Containers");
      CE::Scripting::Bindings::RegisterVector<CE::Core::Audio::AudioDeviceInfo>(&mScriptEngine, "AudioDeviceInfoVector", "CE::Audio::AudioDeviceInfo");
      mScriptEngine.SetDefaultNamespace("CE::Audio");

    Flags:
      - Value
      - AutoGetFlags

    Properties:
      - Type: uint32
        CppMember: Id
        ASMember: id

      - Type: bool
        CppMember: stereo
        ASMember: stereo

      - Type: string
        CppMember: Name
        ASMember: name

    Behaviours:
      - Type: Construct
        Body: |
          new(self) CE::Core::Audio::AudioDeviceInfo;
        CallingConvention: CDeclObjFirst

      - Type: Destruct
        Body: |
          self->~AudioDeviceInfo();
        CallingConvention: CDeclObjFirst

    Operators:
      - Operator: "="
        ReturnType: AudioDeviceInfo
        Signature: "const AudioDeviceInfo & in"
        Body: |
          auto& mutable_info = const_cast<CE::Core::Audio::AudioDeviceInfo&>(self);
          return mutable_info = arg0;
        CallingConvention: Generic

      - Operator: "=="
        ReturnType: bool
        Signature: "const AudioDeviceInfo & in"
        Body: |
          return self.Id == arg0.Id &&
                 self.Name == arg0.Name &&
                 self.stereo == arg0.stereo;
        CallingConvention: Generic