          new(self) glm::mat4(arg0);
        CallingConvention: CDeclObjLast

      - Type: Construct
        Signature: "const Mat4&"
        Body: |
          new(self) glm::mat4(*arg0);
        CallingConvention: CDeclObjLast

      - Type: Destruct
        Body: |
          // glm::mat4 is trivially destructible.
        CallingConvention: CDeclObjLast

    Operators:
      - Operator: "="
        ReturnType: "Mat4&"
        Signature: "const Mat4&"
        Body: |
          *self = *arg0;
          return *self;
        CallingConvention: CDeclObjLast
        IsConst: false

      - Operator: "+"
        ReturnType: Mat4
        Signature: "const Mat4&"
        Body: |
          return *self + *arg0;
        CallingConvention: CDeclObjLast

      - Operator: "-"
        ReturnType: Mat4
