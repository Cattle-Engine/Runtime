    Flags: 
      - Value
      - AutoGetFlags

    Behaviours:
      - Type: Construct
        Body: |
          new(self) CE::Renderer::Camera3D();
        CallingConvention: CDeclObjLast

      - Type: Destruct
        Body: |
          self->~Camera3D();
        CallingConvention: CDeclObjLast

    Properties:
      - Type: Vec3
        CppMember: position
        ASMember:  position

      - Type: Vec3
        CppMember: rotation
        ASMember: rotation

      - Type: Vec3
        CppMember: target
        ASMember: target
      
      - Type: Vec3
        CppMember: up
        ASMember: up

      - Type: float
        CppMember: fov
        ASMember: fov

      - Type: float
        CppMember: nearClip
        ASMember: near_clip

      - Type: float
        CppMember: farClip
        ASMember: far_clip

      - Type: float
        CppMember: orthoSize
        ASMember: ortho_size

      - Type: float
        CppMember: aspectOverride
        ASMember: aspect_override

      - Type: bool
        CppMember: useTarget
        ASMember: use_target

      - Type: Camera3DProjectionMode
        CppMember: projection
