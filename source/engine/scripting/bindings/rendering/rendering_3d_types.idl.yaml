RegistrationPriority: 90
ASNamespace: CE::Graphics::Render3D

RequiredCppHeaders: 
  - "engine/scripting/bindings/as_cubemap.hpp"

ASTypes:    
  - Name: CubemapFace
    CppType: CE::Scripting::Bindings::ASCubemap::Face
    Flags: 
      - Reference
      - NoCount

    Operators:
      - Operator: "="
        ReturnType: "CubemapFace&"
        Signature: const Texture& in
        CppSignature: const CE::Renderer::Resources::TextureHandle&
        Body: |
          *self = arg0;
          return *self;
        IsConst: false

      - Operator: "="
        ReturnType: "CubemapFace&"
        Signature: const CubemapFace& in
        Body: |
          *self = arg0;
          return *self;
        CallingConvention: CDeclObjLast
        IsConst: false

      - Operator: "=="
        ReturnType: bool
        Signature: const CubemapFace& in
        Body: |
          return *self == arg0;
        CallingConvention: CDeclObjLast
        IsConst: True

    Methods: 
      - Name: GetTexture
        ReturnType: Texture
        CppFunction: asMETHOD(CE::Scripting::Bindings::ASCubemap::Face, GetTextureHandle)
        CallingConvention: ThisCall

  - Name: Cubemap
    CppType: CE::Scripting::Bindings::ASCubemap
    Flags:
      - Value

    AfterRegister: |
      CE::Scripting::Bindings::ASCubemap::SetDefaultTextureManager(mRuntime.mTextureManager);

    Behaviours:
      - Type: Construct
        Body: |
          new(self) CE::Scripting::Bindings::ASCubemap();
        CallingConvention: CDeclObjLast

      - Type: Construct
        Signature: Texture left, Texture right = NoTexture, Texture top = NoTexture, Texture bottom = NoTexture, Texture front = NoTexture, Texture back = NoTexture
        CppSignature: CE::Renderer::Resources::TextureHandle, CE::Renderer::Resources::TextureHandle, CE::Renderer::Resources::TextureHandle, CE::Renderer::Resources::TextureHandle, CE::Renderer::Resources::TextureHandle, CE::Renderer::Resources::TextureHandle
        Body: |
          new(self) CE::Scripting::Bindings::ASCubemap();
          self->Left = arg0;
          self->Right = arg1;
          self->Top = arg2;
          self->Bottom = arg3;
          self->Front = arg4;
          self->Back = arg5;
        CallingConvention: CDeclObjLast

      - Type: Destructor
        Body: |
          self->~ASCubemap();
        CallingConvention: CDeclObjLast

    Properties:
      - Type: CubemapFace
        CppMember: Right
        ASMember: right

      - Type: CubemapFace
        CppMember: Left
        ASMember: left

      - Type: CubemapFace
        CppMember: Top
        ASMember: top
      
      - Type: CubemapFace
        CppMember: Bottom
        ASMember: bottom

      - Type: CubemapFace
        CppMember: Front
        ASMember: front

      - Type: CubemapFace
        CppMember: Back
        ASMember: back
