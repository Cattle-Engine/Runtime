RegistrationPriority: 90
ASNamespace: CE::Graphics::Render3D

RequiredCppHeaders: 
  - "engine/scripting/bindings/as_cubemap.hpp"
  - "engine/scripting/bindings/stl_vector_binder.hpp"
  - "engine/rendering/resources/model_renderer.hpp"
  - "engine/rendering/renderer.hpp"

ASEnums:
  - Name: Camera3DProjectionMode
    CppType: CE::Renderer::Camera3D::ProjectionMode
    Values:
      - Perspective
      - Orthographic

ASTypes:    
  - Name: CubemapFace
    CppType: CE::Scripting::Bindings::ASCubemap::Face
    Flags: 
      - Reference
      - NoCount

    Operators:
      - Operator: "="
        ReturnType: "CubemapFace&"
        Signature: const Texture& in
        CppSignature: const CE::Renderer::Resources::TextureHandle&
        Body: |
          *self = arg0;
          return *self;
        IsConst: false

      - Operator: "="
        ReturnType: "CubemapFace&"
        Signature: const CubemapFace& in
        Body: |
          *self = arg0;
          return *self;
        CallingConvention: CDeclObjLast
        IsConst: false

      - Operator: "=="
        ReturnType: bool
        Signature: const CubemapFace& in
        Body: |
          return *self == arg0;
        CallingConvention: CDeclObjLast
        IsConst: True

    Methods: 
      - Name: GetTexture
        ReturnType: Texture
        CppReturnType: CE::Renderer::Resources::TextureHandle
        CppFunction: GetTextureHandle
        CallingConvention: Generic

  - Name: ModelNode
    CppType: CE::Renderer::Resources::Model::Node
    AfterRegister: |
      mScriptEngine.SetDefaultNamespace("CE::Containers");
      CE::Scripting::Bindings::RegisterVector<CE::Renderer::Resources::Model::Node>(&mScriptEngine, "ModelNodeVector", "CE::Graphics::Render3D::ModelNode");
      mScriptEngine.SetDefaultNamespace("CE");

    Flags:
      - Value
      - AutoGetFlags

    Behaviours:
      - Type: Construct
        Body: |
          new(self) CE::Renderer::Resources::Model::Node();
        CallingConvention: CDeclObjLast

      - Type: Destruct
        Body: |
          self->~Node();
        CallingConvention: CDeclObjLast

    Properties:
      - Type: Mat4
        CppMember: Transform
        ASMember: Transform

      - Type: CE::Containers::Uint32Vector
        CppMember: MeshIndices
        ASMember: mesh_indices

      - Type: CE::Containers::Uint32Vector
        CppMember: Children
        ASMember: children

  - Name: Model
    CppType: CE::Renderer::Resources::Model
    Flags:
      - Value
      - AutoGetFlags

    Behaviours:
      - Type: Construct
        Body: |
          new(self) CE::Renderer::Resources::Model();
        CallingConvention: CDeclObjLast

      - Type: Destruct
        Body: |
          self->~Model();
        CallingConvention: CDeclObjLast

    Properties:
      - Type: CE::Containers::MeshVector
        CppMember: Meshes
        ASMember: meshes

      - Type: CE::Containers::MaterialVector
        CppMember: Materials
        ASMember: materials

      - Type: CE::Containers::Uint32Vector
        CppMember: MeshMaterialIndices
        ASMember: mesh_material_indices

      - Type: CE::Containers::ModelNodeVector
        CppMember: Nodes
        ASMember: nodes

      - Type: uint
        CppMember: RootNode
        ASMember: root_node

  - Name: Cubemap
    CppType: CE::Scripting::Bindings::ASCubemap
    Flags:
      - Value

    AfterRegister: |
      CE::Scripting::Bindings::ASCubemap::SetDefaultTextureManager(mRuntime.mTextureManager);

    Behaviours:
      - Type: Construct
        Body: |
          new(self) CE::Scripting::Bindings::ASCubemap();
        CallingConvention: CDeclObjLast

      - Type: Construct
        Signature: const Texture& in left, const Texture& in right = NoTexture, const Texture& in top = NoTexture, const Texture& in bottom = NoTexture, const Texture& in front = NoTexture, const Texture& in back = NoTexture
        CppSignature: const CE::Renderer::Resources::TextureHandle&, const CE::Renderer::Resources::TextureHandle&, const CE::Renderer::Resources::TextureHandle&, const CE::Renderer::Resources::TextureHandle&, const CE::Renderer::Resources::TextureHandle&, const CE::Renderer::Resources::TextureHandle&
        Body: |
          new(self) CE::Scripting::Bindings::ASCubemap();
          self->Left = arg0;
          self->Right = arg1;
          self->Top = arg2;
          self->Bottom = arg3;
          self->Front = arg4;
          self->Back = arg5;
        CallingConvention: CDeclObjLast

      - Type: Destructor
        Body: |
          self->~ASCubemap();
        CallingConvention: CDeclObjLast

    Properties:
      - Type: CubemapFace
        CppMember: Right
        ASMember: right

      - Type: CubemapFace
        CppMember: Left
        ASMember: left

      - Type: CubemapFace
        CppMember: Top
        ASMember: top
      
      - Type: CubemapFace
        CppMember: Bottom
        ASMember: bottom

      - Type: CubemapFace
        CppMember: Front
        ASMember: front

      - Type: CubemapFace
        CppMember: Back
        ASMember: back

  - Name: Camera3D
