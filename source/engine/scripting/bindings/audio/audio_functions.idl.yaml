RegistrationPriority: 90

RequiredCppHeaders:
  - "engine/audio/audio.hpp"
  - <string>

ASNamespace: CE::Audio

ASClassFunctions:
  - Name: LoadSound
    ReturnType: AudioHandle
    Signature: const string& in filepath, const AudioType& in type
    CppSignature: const std::string&, const CE::Audio::Resources::AudioType&
    Description: Loads an audio file from the VFS
    Function: |
      if (!mRuntime.mAudioManager) return AudioHandle{};
      return mRuntime.mAudioManager->LoadSound(arg0, arg1);

  - Name: UnloadSound
    ReturnType: void
    Signature: const AudioHandle& in
    CppSignature: const CE::Audio::Resources::AudioHandle& 
    Description: Unloads an audio handle
    Function: |
      if (!mRuntime.mAudioManager) return;
      mRuntime.mAudioManager->UnloadSound(arg0);

  
