name: Build ce_engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang \
            python3 \
            xxd \
            shaderc

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y ninja cmake python

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
            vcpkg/packages
            vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Clone vcpkg
        shell: bash
        run: |
          if [ ! -d "${VCPKG_ROOT}" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "${VCPKG_ROOT}"
          fi

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmd.exe /c "${VCPKG_ROOT}\\bootstrap-vcpkg.bat" -disableMetrics
          else
            "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install dependencies (vcpkg)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            TRIPLET=x64-windows
            VCPKG_BIN="${VCPKG_ROOT}/vcpkg.exe"
          else
            TRIPLET=x64-linux
            VCPKG_BIN="${VCPKG_ROOT}/vcpkg"
          fi

          "${VCPKG_BIN}" install \
            glm \
            sdl3 \
            sdl3-image \
            sdl3-ttf \
            sdl3-mixer \
            vulkan-headers \
            vulkan-loader \
            --triplet "${TRIPLET}"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CLANG=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: cmake --build build -j 2

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ce_engine-linux
          path: build/ce_engine

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ce_engine-windows
          path: build/ce_engine.exe
