name: Build ce_engine Release

on:
  release:
    types:
      - created

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            autoconf \
            autoconf-archive \
            autocmake \
            libtool

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install -y ninja

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            tools/cache/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir release
          cp build/ce_engine release/ce_engine-linux

      - name: Package Windows build
        if: runner.os == 'Windows'
        run: |
          mkdir release
          cp build/ce_engine.exe release/ce_engine-windows.exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
