name: Build ce_engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm \
            base-devel cmake clang \
            sdl3 sdl3_image sdl3_ttf \
            vulkan-devel shaderc \
            python vim glm sdl3_mixer

      - name: Configure
        run: cmake -B build -S . -DUSE_CLANG=OFF

      - name: Build
        run: cmake --build build --target ce_engine -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ce_engine-linux
          path: build/ce_engine

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-sdl3-mixer mingw-w64-x86_64-sdl3 mingw-w64-x86_64-sdl3-image mingw-w64-x86_64-sdl3-ttf mingw-w64-x86_64-vulkan-headers mingw-w64-x86_64-vulkan-loader mingw-w64-x86_64-python vim

    - name: Install Vulkan SDK
      run: |
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/VulkanSDK-Installer.exe" -OutFile "VulkanSDK.exe"
        Start-Process -FilePath "VulkanSDK.exe" -ArgumentList "/S" -Wait
        $env:Path += ";C:\VulkanSDK\latest\Bin"

    - name: Configure
      shell: msys2 {0}
      run: cmake -B build -S . -G "MinGW Makefiles"

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --target ce_engine -j4

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ce_engine-windows
        path: build/ce_engine.exe